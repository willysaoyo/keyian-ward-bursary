<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyian Ward Bursary | Admin Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div>
          <h1>KEYIAN WARD BURSARY</h1>
          <span>Admin portal - kilgoris Constituency</span>
        </div>
        <a href="index.html" class="admin-btn">Back to application</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero">
        <h2>Admin login</h2>
        <p>Enter your credentials to access the admin portal.</p>
      </section>

      <section class="form-section">
        <form id="admin-login-form">
          <label for="username">Username *</label>
          <input type="text" id="username" required placeholder="Enter your username" />

          <label for="password">Password *</label>
          <input type="password" id="password" required placeholder="Enter your password" />

          <button type="submit">Login</button>
        </form>
      </section>
    </main>

    <footer>
      &copy; 2024 Keyian Ward Bursary. All rights reserved.
    </footer>

    <script src="script.js"></script>
  </body>
