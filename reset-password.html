
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Admin Password | Keyian Ward Bursary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-inner">
            <div>
                <h1>KEYIAN WARD BURSARY</h1>
                <span>Administrator Password Recovery</span>
            </div>
        </div>
    </header>

    <main class="page-shell">

        <section class="hero">
            <h2>Reset Your Password</h2>
            <p>Enter and confirm your new administrator password.</p>
        </section>

        <section class="form-section">

            <form id="reset-password-form">

                <label for="new-password">New Password *</label>

                <input
                    type="password"
                    id="new-password"
                    minlength="8"
                    required
                    placeholder="Enter new password"
                >

                <label for="confirm-password">
                    Confirm New Password *
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    minlength="8"
                    required
                    placeholder="Confirm new password"
                >

                <button type="submit" id="reset-button" disabled>
                    Checking Reset Link...
                </button>

                <p id="reset-message" style="margin-top:15px;"></p>

            </form>

            <p style="text-align:center; margin-top:20px;">
                <a href="admin.html">Back to Admin Login</a>
            </p>

        </section>

    </main>

    <footer>
        &copy; 2026 Keyian Ward Bursary. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", async function () {

        const form = document.getElementById("reset-password-form");
        const passwordInput = document.getElementById("new-password");
        const confirmInput = document.getElementById("confirm-password");
        const resetButton = document.getElementById("reset-button");
        const message = document.getElementById("reset-message");

        const supabase = window.supabaseClient;

        if (!supabase) {
            message.style.color = "red";
            message.textContent = "Supabase connection failed.";
            return;
        }

        let recoveryAllowed = false;

        // Listen for Supabase password recovery event.
        const { data: authListener } =
            supabase.auth.onAuthStateChange(function (event, session) {

                if (event === "PASSWORD_RECOVERY" && session) {
                    recoveryAllowed = true;
                    resetButton.disabled = false;
                    resetButton.textContent = "Update Password";
                    message.style.color = "green";
                    message.textContent =
                        "Reset link verified. You can now create a new password.";
                }
            });

        // Check whether the recovery session exists.
        try {
            const { data, error } = await supabase.auth.getSession();

            if (error) throw error;

            const hasRecoveryUrl =
                window.location.search.includes("code=") ||
                window.location.hash.includes("type=recovery");

            if (hasRecoveryUrl && data.session) {
                recoveryAllowed = true;
                resetButton.disabled = false;
                resetButton.textContent = "Update Password";
                message.style.color = "green";
                message.textContent =
                    "Reset link verified. You can now create a new password.";
            }

        } catch (error) {
            console.error("Recovery verification error:", error);
        }

        if (!recoveryAllowed) {
            message.style.color = "red";
            message.textContent =
                "Your reset link is invalid or expired. Please request another reset email.";
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!recoveryAllowed) {
                alert("Please request a new password reset link.");
                return;
            }

            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;

            if (password.length < 8) {
                alert("Your password must contain at least 8 characters.");
                return;
            }

            if (password !== confirmPassword) {
                alert("The passwords do not match.");
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Updating Password...";

            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                message.style.color = "green";
                message.textContent =
                    "Your password has been updated successfully. Redirecting to admin login...";

                passwordInput.value = "";
                confirmInput.value = "";

                await supabase.auth.signOut();

                setTimeout(function () {
                    window.location.href = "admin.html";
                }, 2500);

            } catch (error) {
                console.error("Password update error:", error);

                message.style.color = "red";
                message.textContent =
                    "Password update failed: " + error.message;

                resetButton.disabled = false;
                resetButton.textContent = "Update Password";
            }
        });

    });
    </script>

</body>
</html>
